<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Habit</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="greeting-block">
          <span class="greeting-time" id="greetingText">Good morning</span>
          <span class="greeting-name" id="nameDisplay">friend</span>
        </div>
      </div>
      <div class="header-center">
        <div class="progress-ring-wrap" id="todayProgressWrap" title="Today's progress">
          <svg class="progress-ring" viewBox="0 0 40 40">
            <circle class="progress-ring-bg" cx="20" cy="20" r="16"/>
            <circle class="progress-ring-fill" id="progressRingFill" cx="20" cy="20" r="16"/>
          </svg>
          <span class="progress-label" id="todayProgressLabel">0/0</span>
        </div>
      </div>
      <div class="header-right">
        <div class="date-block">
          <span class="date-day" id="dayOfWeek"></span>
          <span class="date-full" id="dateDisplay"></span>
        </div>
        <button class="icon-btn" id="headerSettingsBtn" title="Settings">
          <i class="fas fa-sliders"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="habits-grid" id="habitsGrid"></div>
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">No habits yet</div>
      <div class="empty-sub">Hit the + button to start tracking</div>
    </div>
  </main>

  <!-- FABs -->
  <div class="fab-group">
    <button class="fab fab-secondary" id="editHabitBtn" title="Manage habits">
      <i class="fas fa-list-ul"></i>
    </button>
    <button class="fab fab-primary" id="quickAddBtn" title="Log today">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- SETUP MODAL -->
  <div id="setupModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Set up your habits</h2>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Your name</label>
          <input type="text" class="field-input" id="setupName" placeholder="Enter your name" autocomplete="off">
        </div>
        <div class="field-group">
          <label class="field-label">Habits</label>
          <div id="setupHabits"></div>
          <button class="btn-ghost" id="addSetupHabit"><i class="fas fa-plus"></i> Add habit</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="confirmSetup">Start tracking</button>
      </div>
    </div>
  </div>

  <!-- QUICK ADD MODAL -->
  <div id="quickAddModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="quickAddTitle">Today</h2>
        <button class="icon-btn modal-close" id="closeQuickAdd"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="quickAddHabits"></div>
      <div class="modal-footer">
        <button class="btn-primary" id="closeQuickAdd2">Done</button>
      </div>
    </div>
  </div>

  <!-- DAY MODAL -->
  <div id="dayModal" class="modal hidden">
    <div class="modal-box modal-box-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="dayModalTitle"></h2>
        <button class="icon-btn modal-close" id="closeDayModalX"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body day-modal-body">
        <div class="day-value-display" id="dayModalValue">0</div>
        <input type="number" class="day-value-input hidden" id="dayModalInput" step="0.1" min="0">
        <div class="day-controls">
          <button class="day-ctrl-btn" id="decrementBtn">−</button>
          <button class="day-ctrl-btn" id="incrementBtn">+</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="closeDayModal">Done</button>
      </div>
    </div>
  </div>

  <!-- HABIT SETTINGS MODAL -->
  <div id="habitSettingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Habit settings</h2>
        <button class="icon-btn modal-close" id="cancelHabitSettingsX"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Name</label>
          <input type="text" class="field-input" id="habitSettingsName" placeholder="Habit name">
        </div>

        <div class="field-group">
          <label class="field-label">Type</label>
          <div class="type-toggle" id="habitTypeToggle">
            <button class="type-btn active" data-type="number">
              <i class="fas fa-hashtag"></i> Number
            </button>
            <button class="type-btn" data-type="checkbox">
              <i class="fas fa-check"></i> Checkbox
            </button>
          </div>
        </div>

        <div class="field-group" id="unitField">
          <label class="field-label">Unit <span class="field-hint">optional</span></label>
          <input type="text" class="field-input" id="habitSettingsUnit" placeholder="e.g. pages, minutes, glasses">
        </div>

        <div class="field-group">
          <label class="field-label">Icon</label>
          <div class="icon-grid" id="iconSelector">
            <div class="icon-opt" data-icon="fas fa-star"><i class="fas fa-star"></i></div>
            <div class="icon-opt" data-icon="fas fa-dumbbell"><i class="fas fa-dumbbell"></i></div>
            <div class="icon-opt" data-icon="fas fa-book"><i class="fas fa-book"></i></div>
            <div class="icon-opt" data-icon="fas fa-heart"><i class="fas fa-heart"></i></div>
            <div class="icon-opt" data-icon="fas fa-brain"><i class="fas fa-brain"></i></div>
            <div class="icon-opt" data-icon="fas fa-pen"><i class="fas fa-pen"></i></div>
            <div class="icon-opt" data-icon="fas fa-music"><i class="fas fa-music"></i></div>
            <div class="icon-opt" data-icon="fas fa-utensils"><i class="fas fa-utensils"></i></div>
            <div class="icon-opt" data-icon="fas fa-bed"><i class="fas fa-bed"></i></div>
            <div class="icon-opt" data-icon="fas fa-person-walking"><i class="fas fa-person-walking"></i></div>
            <div class="icon-opt" data-icon="fas fa-glass-water"><i class="fas fa-glass-water"></i></div>
            <div class="icon-opt" data-icon="fas fa-code"><i class="fas fa-code"></i></div>
            <div class="icon-opt" data-icon="fas fa-language"><i class="fas fa-language"></i></div>
            <div class="icon-opt" data-icon="fas fa-briefcase"><i class="fas fa-briefcase"></i></div>
            <div class="icon-opt" data-icon="fas fa-moon"><i class="fas fa-moon"></i></div>
            <div class="icon-opt" data-icon="fas fa-sun"><i class="fas fa-sun"></i></div>
            <div class="icon-opt" data-icon="fas fa-dollar-sign"><i class="fas fa-dollar-sign"></i></div>
            <div class="icon-opt" data-icon="fas fa-fire"><i class="fas fa-fire"></i></div>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">Color</label>
          <div class="color-palette" id="colorPalette"></div>
          <input type="color" class="color-custom" id="habitSettingsColor" title="Custom color">
        </div>

        <div class="field-group">
          <label class="field-label">Why are you doing this?</label>
          <div class="reason-chips" id="reasonChips">
            <button class="chip" data-reason="health"><i class="fas fa-heart-pulse"></i> Healthier</button>
            <button class="chip" data-reason="money"><i class="fas fa-coins"></i> More money</button>
            <button class="chip" data-reason="smart"><i class="fas fa-lightbulb"></i> Smarter</button>
            <button class="chip" data-reason="bilingual"><i class="fas fa-globe"></i> Bilingual</button>
            <button class="chip" data-reason="fit"><i class="fas fa-dumbbell"></i> Fitter</button>
            <button class="chip" data-reason="discipline"><i class="fas fa-shield"></i> Discipline</button>
            <button class="chip" data-reason="happy"><i class="fas fa-face-smile"></i> Happier</button>
            <button class="chip" data-reason="creative"><i class="fas fa-palette"></i> Creative</button>
          </div>
        </div>

        <div class="field-group field-group-row">
          <label class="field-label">Archived</label>
          <label class="toggle-wrap">
            <input type="checkbox" id="habitArchivedToggle" class="toggle-input">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </div>
      <div class="modal-footer modal-footer-split">
        <button class="btn-danger" id="deleteHabitBtn">Delete</button>
        <div class="footer-right-btns">
          <button class="btn-ghost" id="cancelHabitSettings">Cancel</button>
          <button class="btn-primary" id="saveHabitSettings">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MANAGE HABITS MODAL -->
  <div id="manageModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Manage habits</h2>
        <button class="icon-btn modal-close" id="closeManage"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="manageHabitsList"></div>
        <button class="btn-ghost btn-full" id="addNewHabit"><i class="fas fa-plus"></i> New habit</button>
        <div class="manage-divider"></div>
        <button class="btn-ghost btn-full archived-toggle-btn" id="showArchivedBtn">
          <i class="fas fa-box-archive"></i> Show archived
        </button>
        <div id="archivedHabitsList" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- APP SETTINGS MODAL -->
  <div id="appSettingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="icon-btn modal-close" id="closeAppSettingsX"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="settings-section-title">Display</div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-name">Show streaks</span>
          </div>
          <label class="toggle-wrap">
            <input type="checkbox" id="streakVisibilityToggle" class="toggle-input">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-name">Highlight today</span>
          </div>
          <label class="toggle-wrap">
            <input type="checkbox" id="todayIndicatorToggle" class="toggle-input">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-name">Grid view</span>
            <span class="setting-sub">Range shown per habit</span>
          </div>
          <select class="field-select" id="gridRangeSelect">
            <option value="year">Full year</option>
            <option value="6">6 months</option>
            <option value="3">3 months</option>
          </select>
        </div>

        <div class="settings-section-title" style="margin-top:1.5rem">Your name</div>
        <div class="field-group">
          <input type="text" class="field-input" id="settingsNameInput" placeholder="Your name">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="closeAppSettings">Done</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
