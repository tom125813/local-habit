<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker - Swiss Style</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Habit Tracker - Swiss Style">
  <meta name="description" content="A beautiful, minimalist habit tracker with GitHub-style contribution charts. Track your daily habits with a clean Swiss design aesthetic.">
  <meta name="keywords" content="habit tracker, habits, productivity, swiss design, minimalist, github style, daily tracker">
  <meta name="author" content="Your Name">

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Habit Tracker">
  <meta property="og:description" content="A beautiful, minimalist habit tracker with GitHub-style contribution charts. Track your daily habits with a clean Swiss design aesthetic.">
  <meta property="og:image" content="https://yourwebsite.com/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://yourwebsite.com/">
  <meta property="twitter:title" content="Habit Tracker">
  <meta property="twitter:description" content="A beautiful, minimalist habit tracker with GitHub-style contribution charts. Track your daily habits with a clean Swiss design aesthetic.">
  <meta property="twitter:image" content="https://yourwebsite.com/twitter-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Manifest -->
  <link rel="manifest" href="/site.webmanifest">

  <!-- Additional -->
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">
  <meta name="revisit-after" content="7 days">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <div class="greeting">
     
      <span id="greetingText"></span>, <span class="name" id="nameDisplay"></span>
      <span id="itsText"></span><span id="dateDisplay"></span>
    </div>
  </div>

  <div class="main">
    <div class="grid" id="habitsGrid"></div>
  </div>

  <button class="edit-habit-btn" id="editHabitBtn" title="Edit habits">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
  </button>

  <button class="quick-add-btn" id="quickAddBtn" title="Quick add today">+</button>

  <div id="setupModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-title">Welcome! Let's set up your habits</div>
      
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-input" id="setupName" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label class="form-label">Your Habits</label>
        <div id="setupHabits"></div>
        <button class="btn-secondary btn-small" id="addSetupHabit">+ Add Habit</button>
      </div>

      <div class="modal-actions">
        <button class="btn" id="confirmSetup">Start Tracking</button>
      </div>
    </div>
  </div>

  <div id="dayModal" class="modal hidden">
    <div class="modal-content day-modal">
      <div class="day-modal-title" id="dayModalTitle"></div>
      <div class="day-modal-value" id="dayModalValue">0</div>
      <div class="day-modal-controls">
        <button class="day-btn" id="decrementBtn">−</button>
        <button class="day-btn" id="incrementBtn">+</button>
      </div>
      <div class="modal-actions">
        <button class="btn btn-small" id="closeDayModal">Done</button>
      </div>
    </div>
  </div>

  <div id="colorModal" class="modal hidden">
    <div class="modal-content color-modal">
      <div class="color-modal-title">Choose a color</div>
      <div class="color-swatches" id="colorSwatches"></div>
      <div class="custom-color-section">
        <label class="custom-color-label">Custom color</label>
        <input type="color" class="custom-color-picker" id="customColorInput">
      </div>
      <div class="modal-actions">
        <button class="btn btn-small" id="confirmColor">Done</button>
      </div>
    </div>
  </div>

  <div id="quickAddModal" class="modal hidden">
    <div class="modal-content quick-add-modal">
      <div class="quick-add-title" id="quickAddTitle">Today's Progress</div>
      <div id="quickAddHabits"></div>
      <div class="modal-actions">
        <button class="btn btn-small" id="closeQuickAdd">Done</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
  
</body>
</html>
